[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbes-tools"
version = "0.10.0"
description = "Python tools for Kongsberg multibeam I/O, backscatter normalization, and MB-System integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Jeff Beeson"}
]
keywords = ["multibeam", "kongsberg", "kmall", "backscatter", "mb-system", "oceanography", "hydrography"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# Sector/angle table generation and applying corrections to KMALL.
backscatter = [
    "scipy",
    "pyproj",
    "pandas",
    "python-dotenv",
]
# Interactive Lambertian balancer GUI (mbes-bs-gui).
gui = [
    "pandas",
    "matplotlib",
]
dev = [
    "pytest",
]

[project.scripts]
mbes-bs-table = "mbes_tools.backscatter.cli:table_main"
mbes-bs-apply = "mbes_tools.backscatter.cli:apply_main"
mbes-bs-gui = "mbes_tools.backscatter.cli:gui_main"
mbes-catalog = "mbes_tools.catalog:main"
mbes-diagnostics = "mbes_tools.diagnostics:main"
mbes-wc-diagnostics = "mbes_tools.wc_diagnostics:main"
mbes-wc-grid = "mbes_tools.water_column:main"
mbes-wc-mosaic = "mbes_tools.water_column_geo:main"

[project.urls]
Repository = "https://github.com/Jeff-Beeson/mbes-tools"
Issues = "https://github.com/Jeff-Beeson/mbes-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
